name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: 类型 / 测试 / 构建
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.1'
          cache: npm

      # 集成测试跑在真实 SQLite 上，由一个 Python 子进程持有连接
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 单元 / 集成测试
        run: npm test

      - name: 前端构建
        run: npm run build

  rust:
    name: Rust 编译检查
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.1'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装依赖（tauri-cli 需要前端产物）
        run: npm ci

      - name: 前端构建
        run: npm run build

      - name: cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml
