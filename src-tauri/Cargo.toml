[package]
name = "wordpacer"
version = "0.1.0"
description = "本地单词复习节奏管理器"
authors = ["wordpacer"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "wordpacer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
